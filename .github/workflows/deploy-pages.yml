name: Deploy Hallucination Lab

# Production only. lab-stable-w4 is the branch students hit at
# https://fibu01.github.io/AI_Fundamentals/ and it is frozen at the verified
# Week 4 build. Development happens on claude/keen-goodall-f0m7ce, which
# deliberately does NOT deploy: a push there used to republish the live site,
# so any work in progress went straight to the students' URL. To ship, merge
# the dev branch into lab-stable-w4 and push that.
on:
  push:
    branches: [main, lab-stable-w4]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect instructor images from anywhere in the repo
        # Uploads have landed in several places over the week (repo root,
        # frontend/public/images, and the lab's own folder). Fold every known
        # location into the build so a drop in any of them ships.
        run: |
          DEST=hallucination-lab/frontend/public/images
          mkdir -p "$DEST"
          for SRC in frontend/public/images images .; do
            for GRID in w12 w13 w14 headers; do
              if [ -d "$SRC/$GRID" ] && [ "$SRC/$GRID" != "$DEST/$GRID" ]; then
                echo "collecting $SRC/$GRID"
                mkdir -p "$DEST/$GRID"
                cp -r "$SRC/$GRID/." "$DEST/$GRID/"
              fi
            done
          done
          echo "image files in build:"
          find "$DEST" -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' \) | wc -l

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: hallucination-lab/frontend/package-lock.json

      - run: npm ci
        working-directory: hallucination-lab/frontend

      - run: npm run build
        working-directory: hallucination-lab/frontend
        env:
          # No proxy behind a static host: every widget uses recorded runs.
          VITE_STATIC_ONLY: '1'

      # Requires Pages to be enabled once by the repo owner:
      # Settings > Pages > Source: GitHub Actions. The workflow token cannot
      # turn it on itself.
      # ---- preview channel -------------------------------------------------
      # GitHub Pages serves one site per repo, so the candidate build ships as
      # a subdirectory of the same site: students stay on the root URL and the
      # preview lives at /preview/. Every step here is continue-on-error, so a
      # broken dev branch can never stop the student site from deploying. If
      # these steps fail the root build still ships and /preview/ is simply
      # absent or stale.
      - name: Check out the dev branch for the preview build
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: claude/keen-goodall-f0m7ce
          path: preview-src

      - name: Collect instructor images for the preview build
        continue-on-error: true
        run: |
          DEST=preview-src/hallucination-lab/frontend/public/images
          mkdir -p "$DEST"
          for SRC in preview-src/frontend/public/images preview-src/images preview-src; do
            for GRID in w12 w13 w14 headers; do
              if [ -d "$SRC/$GRID" ] && [ "$SRC/$GRID" != "$DEST/$GRID" ]; then
                mkdir -p "$DEST/$GRID"
                cp -r "$SRC/$GRID/." "$DEST/$GRID/"
              fi
            done
          done

      - name: Build the preview
        continue-on-error: true
        working-directory: preview-src/hallucination-lab/frontend
        env:
          VITE_STATIC_ONLY: '1'
          VITE_BUILD_CHANNEL: preview
        run: npm ci && npx vite build

      - name: Publish the preview under /preview/
        continue-on-error: true
        run: |
          SRC=preview-src/hallucination-lab/frontend/dist
          if [ -d "$SRC" ]; then
            rm -rf hallucination-lab/frontend/dist/preview
            cp -r "$SRC" hallucination-lab/frontend/dist/preview
            echo "preview published, $(find hallucination-lab/frontend/dist/preview -type f | wc -l) files"
          else
            echo "preview build produced nothing; the student site ships without it"
          fi

      - name: Confirm the student build is untouched
        run: |
          test -f hallucination-lab/frontend/dist/index.html
          if grep -rq "PREVIEW BUILD" hallucination-lab/frontend/dist/assets/*.js; then
            echo "::error::the preview banner leaked into the student build"; exit 1
          fi
          echo "student build intact"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hallucination-lab/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
