name: Deploy Hallucination Lab

on:
  push:
    branches: [main, claude/keen-goodall-f0m7ce]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect instructor images from anywhere in the repo
        # Uploads have landed in several places over the week (repo root,
        # frontend/public/images, and the lab's own folder). Fold every known
        # location into the build so a drop in any of them ships.
        run: |
          DEST=hallucination-lab/frontend/public/images
          mkdir -p "$DEST"
          for SRC in frontend/public/images images .; do
            for GRID in w12 w13 w14 headers; do
              if [ -d "$SRC/$GRID" ] && [ "$SRC/$GRID" != "$DEST/$GRID" ]; then
                echo "collecting $SRC/$GRID"
                mkdir -p "$DEST/$GRID"
                cp -r "$SRC/$GRID/." "$DEST/$GRID/"
              fi
            done
          done
          echo "image files in build:"
          find "$DEST" -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' \) | wc -l

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: hallucination-lab/frontend/package-lock.json

      - run: npm ci
        working-directory: hallucination-lab/frontend

      - run: npm run build
        working-directory: hallucination-lab/frontend
        env:
          # No proxy behind a static host: every widget uses recorded runs.
          VITE_STATIC_ONLY: '1'

      # Requires Pages to be enabled once by the repo owner:
      # Settings > Pages > Source: GitHub Actions. The workflow token cannot
      # turn it on itself.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hallucination-lab/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
